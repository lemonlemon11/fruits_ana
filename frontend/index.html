      // 手机浏览器整站跳转独立移动版站点；URL 带 ?desktop=1 可强制留在桌面版。
      // 需在主 bundle 之前同步执行，用 replace 避免返回键弹回本站再次被跳转。
      (function () {
        if (/[?&]desktop=1/.test(window.location.search)) return
        if (!/Android|iPhone|iPad|iPod|HarmonyOS|Mobile/i.test(navigator.userAgent)) return
        window.location.replace('http://8.134.219.84:54001/')
      })()
