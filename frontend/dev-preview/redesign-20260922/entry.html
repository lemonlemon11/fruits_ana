<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>手工录单 · 布局重设计</title>
<link rel="stylesheet" href="redesign.css" />
</head>
<body data-page="entry" class="has-action-bar">
<main class="page">

  <div class="backbar mobile-only">
    <a class="back" href="imports.html" aria-label="返回录单导入">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m0 0l7 7m-7-7l7-7"/></svg>
    </a>
    <h1>手工录单</h1>
  </div>

  <div class="card card-pad" style="border-left:4px solid var(--brand-600)">
    <b>照着纸质结算单填，带 <span style="color:var(--danger)">*</span> 为必填</b>
    <p class="note" style="margin-top:4px">随时可点「暂存」，下次打开自动恢复；保存后进入正式数据。</p>
  </div>

  <div style="height:14px"></div>

  <div class="acc open">
    <button class="acc-head" type="button">
      ① 基本信息
      <span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
    </button>
    <div class="acc-body">
      <div class="form-grid">
        <div class="field"><label>市场 <span style="color:var(--danger)">*</span></label><select><option>嘉兴水果市场</option><option>广州江南市场</option></select></div>
        <div class="field"><label>商号 <span style="color:var(--danger)">*</span></label><input type="text" placeholder="如 902" value="902" /></div>
        <div class="field"><label>单号 <span style="color:var(--danger)">*</span></label><input type="text" placeholder="如 金秋-005" value="金秋-005" /></div>
        <div class="field"><label>品种</label><select><option>金秋砂糖橘</option><option>沃柑</option></select></div>
        <div class="field"><label>到达市场日期</label><input type="date" value="2026-09-07" /></div>
        <div class="field"><label>销售日期 <span style="color:var(--danger)">*</span></label><input type="date" value="2026-09-08" /></div>
        <div class="field"><label>柜号</label><input type="text" placeholder="如 CBHU2970762" /></div>
        <div class="field"><label>转运车号</label><input type="text" placeholder="如 桂ABF330" /></div>
      </div>
    </div>
  </div>

  <div class="acc open">
    <button class="acc-head" type="button">
      ② 销售明细
      <span class="status badge-n status-info">已填 3 行</span>
      <span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
    </button>
    <div class="acc-body">
      <div class="line-item">
        <div class="field"><label>等级</label><select><option>A</option><option>B</option><option>C（含 BC）</option></select></div>
        <div class="field"><label>规格</label><select><option>大果</option><option>中果</option><option>小果</option></select></div>
        <div class="field"><label>件数</label><input type="number" value="120" /></div>
        <div class="field"><label>单价（元/件）</label><input type="number" value="498.00" /></div>
        <button class="btn btn-ghost desktop-only" type="button" style="min-height:50px">删行</button>
      </div>
      <div class="line-item">
        <div class="field"><label>等级</label><select><option>B</option><option>A</option><option>C（含 BC）</option></select></div>
        <div class="field"><label>规格</label><select><option>中果</option><option>大果</option><option>小果</option></select></div>
        <div class="field"><label>件数</label><input type="number" value="210" /></div>
        <div class="field"><label>单价（元/件）</label><input type="number" value="436.50" /></div>
        <button class="btn btn-ghost desktop-only" type="button" style="min-height:50px">删行</button>
      </div>
      <div class="line-item">
        <div class="field"><label>等级</label><select><option>C（含 BC）</option><option>A</option><option>B</option></select></div>
        <div class="field"><label>规格</label><select><option>小果</option><option>大果</option><option>中果</option></select></div>
        <div class="field"><label>件数</label><input type="number" value="96" /></div>
        <div class="field"><label>单价（元/件）</label><input type="number" value="352.00" /></div>
        <button class="btn btn-ghost desktop-only" type="button" style="min-height:50px">删行</button>
      </div>
      <button class="btn btn-ghost btn-block" type="button" style="margin-top:12px;border-style:dashed">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" style="width:18px;height:18px"><path d="M12 5v14M5 12h14"/></svg>
        再加一行
      </button>
      <p class="note" style="margin-top:10px">已合计 <b class="num">426 件 · ¥185,313</b>（件数 × 单价自动计算）。</p>
    </div>
  </div>

  <div class="acc">
    <button class="acc-head" type="button">
      ③ 售后（没有可不填）
      <span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
    </button>
    <div class="acc-body">
      <div class="line-item">
        <div class="field"><label>售后内容</label><input type="text" placeholder="如 坏果赔付" /></div>
        <div class="field"><label>金额（元）</label><input type="number" placeholder="0.00" /></div>
      </div>
      <button class="btn btn-ghost btn-block" type="button" style="margin-top:12px;border-style:dashed">再加一条售后</button>
    </div>
  </div>

  <div class="acc">
    <button class="acc-head" type="button">
      ④ 费用（没有可不填）
      <span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
    </button>
    <div class="acc-body">
      <div class="form-grid">
        <div class="field"><label>代办费（元）</label><input type="number" placeholder="0.00" /></div>
        <div class="field"><label>运费（元）</label><input type="number" placeholder="0.00" /></div>
        <div class="field"><label>装卸费（元）</label><input type="number" placeholder="0.00" /></div>
        <div class="field"><label>其他费用（元）</label><input type="number" placeholder="0.00" /></div>
      </div>
    </div>
  </div>

</main>

<div class="action-bar">
  <button class="btn btn-ghost" type="button">暂存草稿</button>
  <button class="btn btn-primary" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><path d="M20 6L9 17l-5-5"/></svg>
    保存这张单
  </button>
</div>

<script src="redesign.js"></script>
</body>
</html>
