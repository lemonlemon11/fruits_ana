<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>登录 · SLD 管理员端（设计稿·二）</title>
<link rel="stylesheet" href="design.css" />
<style>
  .portal { min-height: 100vh; display: grid; grid-template-columns: minmax(380px, .88fr) 1.05fr; }

  .portal-panel { display: grid; place-items: center; padding: 28px clamp(20px, 4vw, 56px); background: var(--bg); }
  .auth-card { width: min(392px, 100%); display: grid; gap: 18px; }
  .auth-form { display: grid; gap: 14px; }
  .input-lg { min-height: 48px; font-size: .96rem; border-radius: var(--r-md); }
  .auth-legal { text-align: center; font-size: .72rem; color: var(--faint); line-height: 1.7; }
  .remember { display: inline-flex; align-items: center; gap: 8px; font-size: .84rem; font-weight: 700; color: var(--muted); }
  .remember input { width: 16px; height: 16px; accent-color: var(--g600); }

  .portal-visual {
    position: relative; overflow: hidden;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: clamp(26px, 4vw, 54px);
    background:
      radial-gradient(700px 420px at 12% -6%, rgba(53, 217, 143, .12), transparent 56%),
      repeating-linear-gradient(0deg, rgba(255, 255, 255, .035) 0 1px, transparent 1px 44px),
      repeating-linear-gradient(90deg, rgba(255, 255, 255, .035) 0 1px, transparent 1px 44px),
      var(--bg-deep);
    border-left: 1px solid var(--line);
  }
  .pv-brand { display: flex; align-items: center; gap: 12px; }
  .pv-brand .mark { width: 42px; height: 42px; border-radius: var(--r-md);
    background: var(--g100); color: var(--g400); box-shadow: inset 0 0 0 1px var(--g200);
    display: grid; place-items: center; font-weight: 900; font-size: .8rem; }
  .pv-brand b { font-size: 1.02rem; font-weight: 900; }
  .pv-brand span { display: block; margin-top: 2px; font-size: .72rem; color: var(--faint); font-weight: 700; }

  .pv-mid { display: grid; gap: 18px; max-width: 480px; }
  .pv-kicker { display: inline-flex; align-items: center; gap: 8px; width: fit-content;
    padding: 6px 13px; border-radius: var(--r-pill);
    background: var(--g100); border: 1px solid var(--g200);
    font-size: .74rem; font-weight: 800; color: var(--g400); }
  .pv-kicker i { width: 7px; height: 7px; border-radius: 50%; background: var(--g500); }
  .pv-mid h1 { font-size: clamp(1.8rem, 3.2vw, 2.5rem); font-weight: 900; line-height: 1.22; letter-spacing: -.02em; }
  .pv-mid h1 em { font-style: normal; color: var(--g400); }
  .pv-mid p { color: var(--muted); font-size: .92rem; line-height: 1.8; }

  .pv-modules { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
  .pv-modules span { display: flex; align-items: center; gap: 10px; padding: 11px 13px;
    border-radius: var(--r-md); background: rgba(255, 255, 255, .03); border: 1px solid var(--line);
    font-size: .8rem; font-weight: 800; color: var(--muted); }
  .pv-modules svg { width: 16px; height: 16px; color: var(--g400); }

  .pv-foot { display: flex; gap: 14px; color: var(--faint); font-size: .74rem; font-weight: 700; }

  @media (max-width: 880px) {
    .portal { grid-template-columns: minmax(0, 1fr); }
    .portal-visual { display: none; }
    .portal-panel { place-items: start center; padding-top: 11vh; }
  }
</style>
</head>
<body>
<main class="portal">
  <section class="portal-panel">
    <div class="auth-card">
      <header style="display:grid;gap:8px">
        <span class="eyebrow">管理员控制台</span>
        <h2 style="font-size:1.4rem;font-weight:900;letter-spacing:-.015em">登录管理端</h2>
        <p style="color:var(--muted);font-size:.86rem;margin:0">使用内置管理员账号登录，登录行为将记入审计日志。</p>
      </header>

      <form class="auth-form" onsubmit="return false">
        <label class="field">
          <span>用户名</span>
          <input class="input input-lg" placeholder="管理员账号" autocomplete="username" />
        </label>
        <label class="field">
          <span>密码</span>
          <input class="input input-lg" type="password" placeholder="请输入密码" autocomplete="current-password" />
        </label>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
          <label class="remember"><input type="checkbox" />30 天内免登录</label>
          <a class="text-link" href="#" style="font-size:.84rem">忘记密码？</a>
        </div>
        <button class="btn btn-primary btn-block" style="min-height:48px;font-size:.96rem">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          登 录
        </button>
      </form>

      <p class="auth-legal">连续失败 5 次将临时锁定 10 分钟<br />SLD-水果市场销售分析系统©2026 管理端</p>
    </div>
  </section>

  <section class="portal-visual">
    <div class="pv-brand">
      <span class="mark">SLD</span>
      <span><b>SLD 管理员端</b><span>系统运营控制台</span></span>
    </div>

    <div class="pv-mid">
      <span class="pv-kicker"><i></i>只保留唯一内置管理员账号</span>
      <h1>系统的事，<br />一件一件<em>管清楚</em>。</h1>
      <p>用户、角色、菜单与权限集中配置；业务数据、审计日志、站内通知统一运维，与果农端共用一套数据库、各守各的边界。</p>
      <div class="pv-modules">
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>用户与角色</span>
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>权限与菜单</span>
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></svg>业务数据</span>
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>通知与审计</span>
      </div>
    </div>

    <div class="pv-foot">
      <span>SLD-水果市场销售分析系统©2026</span>
      <span>·</span>
      <span>仅限授权人员访问</span>
    </div>
  </section>
</main>
<div class="preview-banner">设计稿 · 第二稿 · 数据虚构</div>
</body>
</html>
