<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>卖得怎么样 · 一屏看完预览 v2（视觉伴侣 53005）</title>
  <!-- v2：通栏大数带看板语言（variant-O 定稿规范），流体字号自适应 1366/1920/2560；
       令牌与全站同值但自包含，脱离全站 17px 基准。 -->
  <link rel="stylesheet" href="./overview-one-screen.css" />
</head>
<body>
  <header class="preview-topbar">
    <span class="preview-topbar-title">SLD 水果市场销售分析 · 卖得怎么样（销售总览）</span>
    <span class="preview-topbar-badge">视觉伴侣预览 · 53005 · 虚构数据，口径与线上一致</span>
  </header>

  <main class="overview-preview" id="overview-root">
    <!-- 筛选栏：紧凑单行（日期吃满剩余行宽） -->
    <form class="filter-bar" onsubmit="return false">
      <label class="f-field f-field--date">
        <span>销售日期</span>
        <span class="date-inputs">
          <input type="date" value="2026-01-02" aria-label="销售日期起" />
          <span class="date-sep">~</span>
          <input type="date" value="2026-09-20" aria-label="销售日期止" />
        </span>
      </label>
      <label class="f-field">
        <span>国家</span>
        <select aria-label="国家">
          <option>全部国家</option>
          <option selected>越南</option>
          <option>泰国</option>
        </select>
      </label>
      <label class="f-field">
        <span>市场</span>
        <select aria-label="市场">
          <option selected>全部市场</option>
          <option>广州江南</option>
          <option>长沙海吉星</option>
          <option>武汉白沙洲</option>
        </select>
      </label>
      <button class="primary-btn" type="submit">查看结果</button>
    </form>

    <!-- 通栏大数带：hero 金额 + 三格 KPI；副行 = 等级均价 + 覆盖范围（纯销售口径） -->
    <section class="hero-band" aria-label="销售情况">
      <div class="hero-cells" id="hero-cells"><!-- JS 注入 --></div>
      <div class="hero-sub">
        <div class="grade-chips" id="grade-chips"><!-- JS 注入 A/B/C 均价胶囊 --></div>
        <p class="hero-coverage" id="hero-coverage"></p>
      </div>
    </section>

    <!-- 每日销售趋势：全宽主图，峰值/末值标注 -->
    <section class="card trend-card" aria-labelledby="trend-title">
      <header class="card-heading">
        <h2 id="trend-title">每日销售趋势</h2>
        <div class="trend-toggle" role="group" aria-label="趋势指标切换">
          <button type="button" class="trend-toggle-btn is-active" data-metric="amount">金额</button>
          <button type="button" class="trend-toggle-btn" data-metric="quantity">件数</button>
        </div>
      </header>
      <div id="trend-chart" aria-label="每日销售趋势图"></div>
    </section>

    <!-- 三卡一行：等级件数结构 | 等级均价 | 市场销售分析 -->
    <div class="trio-row">
      <section class="card grade-pie-card" aria-labelledby="grade-pie-title">
        <header class="card-heading">
          <h2 id="grade-pie-title">等级件数结构</h2>
        </header>
        <div class="donut-layout">
          <div class="css-donut" id="grade-donut" role="img" aria-label="等级件数结构环图"></div>
          <ul class="legend-list" id="grade-legend"></ul>
        </div>
      </section>

      <section class="card grade-price-card" aria-labelledby="grade-price-title">
        <header class="card-heading">
          <h2 id="grade-price-title">等级均价</h2>
          <span class="heading-note">加权 = 金额 ÷ 件数</span>
        </header>
        <div class="price-bars" id="grade-price-bars"><!-- JS 注入 --></div>
      </section>

      <section class="card market-card" aria-labelledby="market-title">
        <header class="card-heading">
          <h2 id="market-title">市场销售分析</h2>
          <span class="heading-note">柜数 = 结算单数</span>
        </header>
        <div class="market-body">
          <div class="donut-layout">
            <div class="css-donut" id="market-donut" role="img" aria-label="各品牌柜数环图"></div>
            <ul class="legend-list" id="market-legend"></ul>
          </div>
          <ul class="market-bars" id="market-bars" aria-label="市场 × 品牌柜数"></ul>
        </div>
      </section>
    </div>

    <!-- 规格件数与均价：A/B/C 三列共用网格模板，数据纵向对齐 -->
    <section class="card spec-card" aria-labelledby="spec-title">
      <header class="card-heading">
        <h2 id="spec-title">规格件数与均价</h2>
        <div class="spec-tools">
          <label class="spec-filter">
            <span>品牌</span>
            <select id="spec-brand-filter" aria-label="规格品牌筛选"></select>
          </label>
          <label class="spec-filter">
            <span>等级</span>
            <select id="spec-grade-filter" aria-label="规格等级筛选"></select>
          </label>
          <button type="button" class="detail-toggle" id="detail-toggle"
            aria-expanded="false" aria-controls="detail-panel">查看明细 ▾</button>
        </div>
      </header>
      <div class="spec-groups" id="spec-summary"><!-- JS 注入三列摘要 --></div>
    </section>

    <!-- 查看明细：页内手风琴，全宽展开 7 列规格明细长表（数字右对齐） -->
    <section class="card detail-panel" id="detail-panel" hidden aria-labelledby="detail-title">
      <header class="card-heading">
        <h2 id="detail-title">规格明细 · 各等级各规格果销售情况</h2>
        <button type="button" class="detail-toggle" id="detail-collapse"
          aria-expanded="true" aria-controls="detail-panel">收起明细 ▴</button>
      </header>
      <div class="spec-table-wrap">
        <table class="spec-table" id="spec-table">
          <thead>
            <tr>
              <th>品牌</th><th>等级</th><th>头数</th><th>KG</th>
              <th>备注</th><th>总件数</th><th>每件均价</th>
            </tr>
          </thead>
          <tbody id="spec-table-body"><!-- JS 注入 --></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="../node_modules/echarts/dist/echarts.min.js"></script>
  <script src="./overview-one-screen.data.js"></script>
  <script src="./overview-one-screen.js"></script>
</body>
</html>
