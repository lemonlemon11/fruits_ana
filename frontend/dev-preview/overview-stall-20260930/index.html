<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>销售总览 · 档口销售数据 demo（真实数据 · 53002）</title>
  <!-- 销售总览（档口数据）：按老板思维模型「年（总柜数·金额/数量）→ 月（月柜数）→ 日（日柜数）」
       三级同屏瀑布；数据为真实接口快照（tmp/stall-demo/fetch_real_data.py 生成 real-data.js，
       不入库）。本页不产生任何写操作，业务代码零改动。 -->
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <header class="topbar" id="topbar"></header>

      <!-- 年层：档口销售数据大数带 -->
      <section class="year-band" aria-label="年度档口销售数据">
        <div class="year-band-head">
          <span class="tier tier-year">年</span>
          <h2 id="year-title">2026 年 · 档口销售数据</h2>
          <span class="year-context" id="year-context"></span>
        </div>
        <div class="kpi-grid" id="kpi-grid"></div>
      </section>

      <!-- 月层：月柜数与销售 -->
      <div class="row monthly-row">
        <section class="card chart-card monthly-card" aria-label="月度档口销售">
          <header class="card-head">
            <span class="tier">月</span>
            <h3>月柜数与销售</h3>
            <span class="card-note" id="monthly-unit"></span>
            <div id="monthly-seg-slot"></div>
          </header>
          <div class="chart" id="monthly-chart"></div>
        </section>
        <aside class="card rail-card" id="monthly-rail" aria-label="月度概览"></aside>
      </div>

      <!-- 日层：日柜数与销售趋势 -->
      <section class="card chart-card daily-card" aria-label="每日档口销售趋势">
        <header class="card-head">
          <span class="tier">日</span>
          <h3>日柜数与销售趋势</h3>
          <span class="card-note" id="daily-unit"></span>
          <div id="daily-seg-slot"></div>
        </header>
        <div class="daily-body">
          <div class="chart chart-tall" id="daily-chart"></div>
          <aside class="rail" id="daily-rail" aria-label="销售概览"></aside>
        </div>
      </section>

      <div class="row grade-row">
        <section class="card grade-card" aria-label="等级件数与均价">
          <header class="card-head">
            <h3>等级件数与均价</h3>
            <span class="card-note">口径与系统一致（BC 归 C）</span>
          </header>
          <table class="data-table" id="grade-table">
            <thead>
              <tr><th>等级</th><th class="num">件数</th><th class="num">销售金额</th><th>件数占比</th><th class="num">件均价</th></tr>
            </thead>
            <tbody id="grade-body"></tbody>
          </table>
        </section>

        <section class="card mb-card" aria-label="档口与品牌销售分析">
          <header class="card-head">
            <h3>档口 × 品牌销售分析</h3>
            <span class="card-note">柜数 = 结算单数</span>
            <div id="mb-seg-slot"></div>
          </header>
          <table class="data-table" id="mb-table">
            <thead id="mb-head"></thead>
            <tbody id="mb-body"></tbody>
          </table>
        </section>
      </div>

      <!-- 规格销售明细 -->
      <section class="card spec-card" aria-label="规格销售明细">
        <header class="card-head">
          <h3>规格销售明细</h3>
          <span class="card-note">各等级下的主要规格销售与价格</span>
          <div class="spec-tools">
            <label class="spec-filter">
              <span>品牌</span>
              <select id="spec-brand-filter" aria-label="规格品牌筛选">
                <option value="all" selected>全部品牌</option>
              </select>
            </label>
            <label class="spec-filter">
              <span>等级</span>
              <select id="spec-grade-filter" aria-label="规格等级筛选">
                <option value="all" selected>全部等级</option>
              </select>
            </label>
          </div>
        </header>
        <div class="spec-grid" id="spec-grid"></div>
      </section>
    </main>
  </div>

  <script src="./echarts.min.js"></script>
  <script src="./real-data.js"></script>
  <script src="./app-core.js"></script>
  <script src="./app.js"></script>
</body>
</html>
