<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>录单 / 导入 demo（真实数据 · 53002）</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <header class="topbar" id="topbar"></header>

      <div class="mode-cards">
        <section class="card mode-card" id="mode-upload" role="button" tabindex="0" aria-label="上传结算单">
          <span class="mode-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 20h16"/></svg></span>
          <div><h4>上传结算单</h4><p>选择 .xlsx 结算单文件后会自动解析并进入二次确认；demo 仅展示入口，不触发上传。</p></div>
        </section>
        <section class="card mode-card" id="mode-entry" role="button" tabindex="0" aria-label="手工录单">
          <span class="mode-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span>
          <div><h4>手工录单</h4><p>不依赖 Excel 直接录入结算单，保存后进入同一分析链路；表单骨架见下方「手工录单」。</p></div>
        </section>
      </div>

      <section class="card" aria-label="数据质量概览">
        <header class="card-head"><h3>数据质量概览</h3><span class="card-note">口径与系统一致（导入批次与问题统计）</span></header>
        <div class="quality-grid" id="quality-grid"></div>
      </section>

      <section class="card" aria-label="最近导入">
        <header class="card-head"><h3>导入记录</h3><span class="card-note" id="import-note"></span></header>
        <div class="batch-list" id="batch-list"></div>
      </section>

      <section class="card" id="manual-entry" aria-label="手工录单">
        <header class="card-head">
          <h3>手工录单</h3>
          <span class="card-note">表单骨架与字段字典为真实配置；demo 不提交、不写库</span>
        </header>

        <p class="sub-block-title">基本信息</p>
        <div class="form-grid" id="base-form"></div>

        <p class="sub-block-title" style="margin-top:18px;">销售明细 <span class="card-note">金额 = 数量 × 单价（自动）</span></p>
        <table class="form-table" id="sales-table">
          <thead>
            <tr><th style="width:150px;">销售日期</th><th style="width:110px;">品种</th><th style="width:90px;">等级</th><th style="width:90px;">规格头数</th><th style="width:90px;">规格KG</th><th>备注</th><th style="width:90px;">数量（件）</th><th style="width:90px;">单价（元）</th><th style="width:100px;">金额（元）</th></tr>
          </thead>
          <tbody id="sales-body"></tbody>
        </table>
        <button type="button" class="btn-ghost" id="add-sale-row" style="margin-top:8px;">+ 添加一行</button>

        <p class="sub-block-title" style="margin-top:18px;">售后明细</p>
        <table class="form-table" id="after-table">
          <thead><tr><th style="width:180px;">内容</th><th>摘要</th><th style="width:120px;">金额（元）</th></tr></thead>
          <tbody id="after-body"></tbody>
        </table>

        <p class="sub-block-title" style="margin-top:18px;">支出费用</p>
        <table class="form-table" id="fee-table">
          <thead><tr><th style="width:180px;">费用名</th><th>摘要</th><th style="width:120px;">金额（元）</th></tr></thead>
          <tbody id="fee-body"></tbody>
        </table>

        <p class="sub-block-title" style="margin-top:18px;">结算核对 <span class="card-note">随明细自动计算</span></p>
        <div class="settle-summary" id="settle-summary"></div>

        <div style="display:flex;gap:10px;margin-top:16px;">
          <button type="button" class="btn-ghost" disabled title="demo 不写库">暂存草稿</button>
          <button type="button" class="apply-btn" id="entry-submit">确认保存</button>
        </div>
      </section>
    </main>
  </div>

  <script src="./real-data.js"></script>
  <script src="./app-core.js"></script>
  <script src="./entry-import.js"></script>
</body>
</html>
