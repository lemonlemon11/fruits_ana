name: fruits-ana

services:
  fruits-backend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.fruits-backend
    image: fruits-ana-backend:local
    env_file:
      - .env.docker
    network_mode: host
    restart: unless-stopped
    volumes:
      - fruits_uploads:/app/backend/data/uploads
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  admin-backend:
    build:
      context: ../../../fruits_ana_admin
      dockerfile: deploy/docker/Dockerfile.admin-backend
    image: fruits-ana-admin-backend:local
    env_file:
      - .env.docker
    network_mode: host
    restart: unless-stopped
    depends_on:
      fruits-backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  fruits-web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.fruits-web
    image: fruits-ana-web:local
    network_mode: host
    restart: unless-stopped
    depends_on:
      fruits-backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:53000/
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  admin-web:
    build:
      context: ../../../fruits_ana_admin
      dockerfile: deploy/docker/Dockerfile.admin-web
    image: fruits-ana-admin-web:local
    network_mode: host
    restart: unless-stopped
    depends_on:
      admin-backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:54000/
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  fruits_uploads:
