name: fruits-ana-offline

services:
  fruits-backend:
    image: fruits-ana-backend:local
    pull_policy: never
    env_file:
      - .env.docker
    network_mode: host
    restart: unless-stopped
    volumes:
      - fruits_uploads:/app/backend/data/uploads
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  fruits-web:
    image: fruits-ana-web:local
    pull_policy: never
    network_mode: host
    restart: unless-stopped
    depends_on:
      fruits-backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:53000/
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  fruits_uploads:
