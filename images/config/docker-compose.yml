name: fruits-ana-offline

services:
  fruits-backend:
    image: fruits-ana-backend:local
    pull_policy: never
    env_file:
      - .env.docker
    network_mode: host
    restart: unless-stopped
    # 上传原件与日志映射到宿主机（相对路径以本 compose 文件所在目录为基准，
    # 默认 ./data；如需自定义，先 export FRUITS_DATA_DIR=/绝对路径 再执行 compose）
    volumes:
      - ${FRUITS_DATA_DIR:-./data}/uploads:/app/backend/data/uploads
      - ${FRUITS_DATA_DIR:-./data}/logs:/app/backend/data/logs
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  fruits-web:
    image: fruits-ana-web:local
    pull_policy: never
    network_mode: host
    restart: unless-stopped
    depends_on:
      fruits-backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:53000/
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
