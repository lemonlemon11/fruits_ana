  </g>

  <!-- 连接线 -->
  <line x1="155" y1="210" x2="155" y2="290" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="385" y1="210" x2="385" y2="290" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="615" y1="210" x2="615" y2="290" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="845" y1="210" x2="845" y2="290" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="260" y1="370" x2="260" y2="540" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="710" y1="370" x2="710" y2="540" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="420" y1="581" x2="470" y2="581" stroke="#2F6FED" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="800" y1="581" x2="880" y2="540" stroke="#0F9D58" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="635" y1="622" x2="635" y2="644" stroke="#2F6FED" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <path d="M800 581 C 830 581 850 600 880 690" fill="none" stroke="#DB2777" stroke-width="2" marker-end="url(#arrowPink)"/>

  <line x1="510" y1="829" x2="60" y2="829" stroke="#EA8600" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="285" y="816" text-anchor="middle" font-size="12" fill="#EA8600">回归验证后发布至生产</text>
