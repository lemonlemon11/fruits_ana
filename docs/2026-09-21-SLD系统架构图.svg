  <!-- 生产 ECS -->
  <text x="60" y="442" font-size="15" font-weight="700" fill="#334155">生产环境：阿里云 ECS 应用服务器</text>
  <g filter="url(#shadow)">
    <rect x="60" y="460" width="760" height="230" rx="16" fill="#FFFFFF" stroke="#2F6FED" stroke-width="2"/>
    <text x="80" y="492" font-size="16" font-weight="700" fill="#0F172A">阿里云 ECS 应用服务器（生产）</text>
    <text x="80" y="516" font-size="13" fill="#64748B">同机部署：Nginx + FastAPI + 上传文件目录</text>

    <rect x="90" y="540" width="330" height="82" rx="10" fill="#EAF2FF" stroke="#2F6FED" stroke-width="1.5"/>
    <text x="255" y="572" text-anchor="middle" font-size="16" fill="#0F172A">Nginx</text>
    <text x="255" y="594" text-anchor="middle" font-size="13" fill="#475569">Vue 静态资源 + /api 反向代理</text>
    <text x="255" y="612" text-anchor="middle" font-size="13" fill="#475569">端口 53000 → 127.0.0.1:8000</text>

    <rect x="470" y="540" width="330" height="82" rx="10" fill="#EAF2FF" stroke="#2F6FED" stroke-width="1.5"/>
    <text x="635" y="572" text-anchor="middle" font-size="16" fill="#0F172A">FastAPI / Uvicorn</text>
    <text x="635" y="594" text-anchor="middle" font-size="13" fill="#475569">backend/app/main.py</text>
    <text x="635" y="612" text-anchor="middle" font-size="13" fill="#475569">认证 / 导入 / 分析 / 顺仔问答</text>

    <rect x="90" y="644" width="710" height="34" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="445" y="666" text-anchor="middle" font-size="13" fill="#475569">上传文件目录 backend/data/uploads/（不入库、不提交 Git）</text>
  </g>

  <!-- RDS -->
  <g filter="url(#shadow)">
    <rect x="880" y="460" width="280" height="160" rx="16" fill="#E7F7EF" stroke="#0F9D58" stroke-width="2"/>
