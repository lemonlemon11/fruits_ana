  <text x="40" y="78" font-size="16" fill="#64748B">版本 V1.0 ｜ 编制日期 2026-09-21 ｜ 按已申请 / 预留服务器清单绘制</text>

  <!-- 用户层 -->
  <text x="60" y="122" font-size="15" font-weight="700" fill="#334155">用户与微信生态</text>
  <g filter="url(#shadow)">
    <rect x="60" y="140" width="190" height="70" rx="12" fill="#EAF2FF" stroke="#2F6FED" stroke-width="1.5"/>
    <text x="155" y="170" text-anchor="middle" font-size="16" fill="#0F172A">PC / 手机浏览器</text>
    <text x="155" y="192" text-anchor="middle" font-size="13" fill="#475569">用户端 / 管理端</text>

    <rect x="290" y="140" width="190" height="70" rx="12" fill="#EAF2FF" stroke="#2F6FED" stroke-width="1.5"/>
    <text x="385" y="170" text-anchor="middle" font-size="16" fill="#0F172A">微信公众号</text>
    <text x="385" y="192" text-anchor="middle" font-size="13" fill="#475569">品牌入口 / 消息触达</text>

    <rect x="520" y="140" width="190" height="70" rx="12" fill="#EAF2FF" stroke="#2F6FED" stroke-width="1.5"/>
    <text x="615" y="170" text-anchor="middle" font-size="16" fill="#0F172A">微信小程序</text>
    <text x="615" y="192" text-anchor="middle" font-size="13" fill="#475569">移动端业务入口</text>

    <rect x="750" y="140" width="190" height="70" rx="12" fill="#EAF2FF" stroke="#2F6FED" stroke-width="1.5"/>
    <text x="845" y="170" text-anchor="middle" font-size="16" fill="#0F172A">企业微信</text>
    <text x="845" y="192" text-anchor="middle" font-size="13" fill="#475569">实名认证 / 协同通知</text>
