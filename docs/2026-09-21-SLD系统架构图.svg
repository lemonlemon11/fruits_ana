    <text x="260" y="324" text-anchor="middle" font-size="16" fill="#0F172A">域名 / DNS / SSL</text>
    <text x="260" y="350" text-anchor="middle" font-size="13" fill="#475569">系统访问入口与 HTTPS 证书</text>

    <rect x="510" y="290" width="400" height="80" rx="12" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="710" y="324" text-anchor="middle" font-size="16" fill="#0F172A">WAF / 安全服务</text>
    <text x="710" y="350" text-anchor="middle" font-size="13" fill="#475569">安全防护、访问控制与监控告警</text>
