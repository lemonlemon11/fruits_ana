    <text x="900" y="520" font-size="13" fill="#475569">生产业务数据库</text>
    <text x="900" y="546" font-size="13" fill="#475569">sales / settlement</text>
    <text x="900" y="568" font-size="13" fill="#475569">user / import</text>
    <text x="900" y="590" font-size="13" fill="#475569">RBAC / 会话 / 草稿</text>
  </g>

  <!-- DeepSeek -->
  <g filter="url(#shadow)">
    <rect x="880" y="650" width="280" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="1.5"/>
    <text x="900" y="682" font-size="16" font-weight="700" fill="#0F172A">DeepSeek 大模型服务</text>
    <text x="900" y="706" font-size="13" fill="#475569">顺仔问答 / AI 分析</text>
    <text x="900" y="726" font-size="13" fill="#DB2777">内部研发成本，不向客户列支</text>
  </g>

  <!-- 测试服务器 -->
